services:
  amecc-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_PATH: /data/amecc.sqlite
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://nguyenduchieu1208.github.io}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      SESSION_TTL_SECONDS: 28800
      MAX_UPLOAD_BYTES: 10485760
    volumes:
      - ./data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - amecc-api
    environment:
      AMECC_API_DOMAIN: ${AMECC_API_DOMAIN:?Set AMECC_API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
